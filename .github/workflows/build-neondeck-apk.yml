name: Build NeonDeck APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["neon/**", ".github/workflows/build-neondeck-apk.yml"]
    tags: ["neon-v*"]

permissions:
  contents: write # needed to attach the APK to a release on version tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compute version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/neon-v* ]]; then
            VN="${GITHUB_REF_NAME#neon-v}"
          else
            VN="0.1.0-dev.${GITHUB_RUN_NUMBER}+${GITHUB_SHA:0:7}"
          fi
          echo "VERSION_NAME=$VN" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "Building version $VN (code $GITHUB_RUN_NUMBER)"

      - name: Assemble debug APK
        working-directory: neon
        run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log

      - name: Report Gradle failure
        if: failure()
        run: |
          grep -m 20 -E "^e: |error:|FAILURE:|^\* What went wrong|Caused by:" /tmp/gradle.log > /tmp/gradle.err || true
          [ -s /tmp/gradle.err ] || tail -n 20 /tmp/gradle.log > /tmp/gradle.err
          while IFS= read -r line; do
            esc=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g' | cut -c1-400)
            echo "::error::${esc}"
          done < /tmp/gradle.err

      - name: Name the APK
        run: |
          mkdir -p dist
          SRC=$(find neon/app/build/outputs/apk/debug -type f -name "*.apk" | head -n1)
          if [ -z "$SRC" ]; then
            echo "::error::No debug APK found under neon/app/build/outputs/apk/debug"
            exit 1
          fi
          SAFE_REF="$(echo "${VERSION_NAME:-$GITHUB_REF_NAME}" | tr '/' '-')"
          cp "$SRC" "dist/Kestrane-NeonDeck-${SAFE_REF}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: kestrane-neondeck-apk
          path: dist/*.apk

      - name: Attach APK to the GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/neon-v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
