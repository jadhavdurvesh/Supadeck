name: Deploy Supabase Edge Function

on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", ".github/workflows/deploy-functions.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check required secrets
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$PROJECT_ID" ] && missing="$missing SUPABASE_PROJECT_REF"
          [ -z "${{ secrets.ADMIN_USER_IDS }}" ] && missing="$missing ADMIN_USER_IDS"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secret(s):$missing — add them under Settings > Secrets and variables > Actions"
            exit 1
          fi

      - name: Deploy admin-api
        run: supabase functions deploy admin-api --project-ref "$PROJECT_ID" --no-verify-jwt

      - name: Set function secrets
        run: |
          supabase secrets set --project-ref "$PROJECT_ID" \
            ADMIN_USER_IDS="${{ secrets.ADMIN_USER_IDS }}" \
            MGMT_ACCESS_TOKEN="$SUPABASE_ACCESS_TOKEN"
