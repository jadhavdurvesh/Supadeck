name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/build-apk.yml"]
    tags: ["v*"]

permissions:
  contents: write # needed to attach the APK to a release on version tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log

      - name: Report Gradle failure
        if: failure()
        run: |
          echo "::group::Full Gradle log"
          cat /tmp/gradle.log
          echo "::endgroup::"
          grep -m 20 -E "^e: |error:|FAILURE:|^\* What went wrong|Caused by:" /tmp/gradle.log > /tmp/gradle.err || true
          if [ -s /tmp/gradle.err ]; then
            while IFS= read -r line; do
              escaped=$(echo "$line" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
              echo "::error::${escaped}"
            done < /tmp/gradle.err
          else
            tail -n 20 /tmp/gradle.log | while IFS= read -r line; do
              escaped=$(echo "$line" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
              echo "::error::${escaped}"
            done
          fi

      - name: Name the APK
        run: |
          set -x
          echo "Looking for the built APK..."
          find android/app/build/outputs -type f -name "*.apk" || true
          mkdir -p dist
          SRC=$(find android/app/build/outputs/apk/debug -type f -name "*.apk" | head -n1)
          if [ -z "$SRC" ]; then
            echo "::error::No debug APK found under android/app/build/outputs/apk/debug"
            exit 1
          fi
          SAFE_REF="$(echo "$GITHUB_REF_NAME" | tr '/' '-')"
          cp "$SRC" "dist/Kestrane-SupaDeck-${SAFE_REF}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: kestrane-supadeck-apk
          path: dist/*.apk

      - name: Attach APK to the GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
