name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/build-apk.yml"]
    tags: ["v*"]

permissions:
  contents: write # needed to attach the APK to a release on version tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/Kestrane-SupaDeck-${GITHUB_REF_NAME//\//-}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: kestrane-supadeck-apk
          path: dist/*.apk

      - name: Attach APK to the GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
